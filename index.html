<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outbox PWA</title>
  <meta name="theme-color" content="#f4f4f4">
  <meta name="description" content="Manda mensajes aunque no haya internet: se guardan y salen solos despues.">
  <link rel="stylesheet" href="./styles.css">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
</head>
<body>
  <header>
    <h1>Outbox PWA</h1>
    <div class="badges">
      <span id="badge" class="badge">Viendo la red...</span>
      <span id="contador" class="badge badge-cola">0 en cola</span>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Nuevo mensaje</h2>
      <p class="nota">Si no sale, se queda en la cola y se intenta otra vez.</p>

      <form id="form">
        <input id="titulo" type="text" maxlength="80" placeholder="Titulo (ej. Nota para el profe)" autocomplete="off" required>
        <textarea id="mensaje" rows="4" maxlength="500" placeholder="Escribe lo que quieras mandar..." required></textarea>

        <label class="check">
          <input id="fallo" type="checkbox">
          Simular que el server fallo
        </label>

        <div class="acciones">
          <button id="btn-enviar" type="submit">Enviar</button>
          <button id="btn-sync" type="button" class="boton-sec">Sincronizar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="fila">
        <h2>La cola</h2>
        <button id="btn-purgar" type="button" class="boton-sec">Borrar enviados</button>
      </div>

      <ul id="lista">
        <li class="vacia">Nada por aqui.</li>
      </ul>
    </section>

    <section class="card">
      <h2>Lo que pasa</h2>
      <pre id="log">Esperando...</pre>
    </section>
  </main>

  <footer>Practica 5.1 - 5.3</footer>

  <script src="./db-helper.js"></script>
  <script src="./app.js"></script>
</body>
</html>
